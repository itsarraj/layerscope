[package]
name = "layerscope"
version = "0.1.0"
edition = "2021"
description = "A container image layer/bloat analyzer — a dive alternative"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/layerscope"
readme = "README.md"
keywords = ["docker", "dive", "container", "image", "layers"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "layerscope"
path = "src/lib.rs"

[[bin]]
name = "layerscope"
path = "src/main.rs"

[dependencies]
tar = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
